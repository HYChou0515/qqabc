name: 文件構建與部署 (MkDocs)

on:
  push:
    branches: [master, docs*]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4

      - name: 設置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安裝 uv
        uses: astral-sh/setup-uv@v3

      - name: 安裝依賴
        run: uv sync --dev

      - name: 構建文檔 (mkdocs --strict)
        run: uv run mkdocs build --strict

      - name: 設置 Pages
        uses: actions/configure-pages@v4

      - name: 上傳 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 只在 master 分支自動部署; docs* 分支只做 build 驗證
    if: github.ref == 'refs/heads/master'
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
