name: CI 測試

on:
  push:
    branches: [master, main, "dev*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  # 程式碼品質檢查 + 靜態型別檢查
  lint:
    name: "Lint + ty"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 設置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安裝 uv
        uses: astral-sh/setup-uv@v3

      - name: 安裝依賴
        run: uv sync --dev

      - name: 檢查程式碼品質
        run: |
          uv run ruff check .
          uv run ruff format --check

      - name: 靜態型別檢查 (ty)
        run: uv run --extra httpx ty check src/

  # 跨版本測試 + 統一覆蓋率
  test:
    name: "Test py${{ matrix.python }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: 設置 Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安裝 uv
        uses: astral-sh/setup-uv@v3

      - name: 執行測試 (coverage parallel)
        run: |
          uv run --extra httpx --python ${{ matrix.python }} \
            coverage run -p --branch -m pytest -m "not benchmark" tests -v

      - name: 上傳 coverage parallel artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: ignore

  # 合併所有 python 版本的 coverage
  coverage:
    name: "Coverage combine"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 設置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安裝 uv
        uses: astral-sh/setup-uv@v3

      - name: 安裝依賴
        run: uv sync --dev

      - name: 下載所有 coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: 合併並報告 coverage
        run: |
          uv run coverage combine
          uv run coverage report -m
